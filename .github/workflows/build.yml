name: Test and Coverage
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info

      - name: Upload coverage manually
        run: |
          LCOV_BASE64=$(base64 -w 0 coverage/lcov.info)

          curl -X POST https://mark.truemark.dev/api/coverage/upload \
            -H "Content-Type: application/json" \
            -d "{
              \"coverage\": \"${LCOV_BASE64}\",
              \"commit\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"repository\": \"${{ github.repository }}\",
              \"token\": \"${{ secrets.BOB_COVERAGE_TOKEN }}\",
              \"buildId\": \"${{ github.run_id }}:${{ github.run_attempt }}\"
            }"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Echo build information
        run: |
          echo "Building project..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -la

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Dependencies installed successfully!"

      - name: Build project
        run: |
          echo "Starting build process..."
          echo "Build completed successfully!"

      - name: Display summary
        run: |
          echo "========================================="
          echo "Build Summary"
          echo "========================================="
          echo "Status: Success"
          echo "Timestamp: $(date)"
          echo "========================================="
